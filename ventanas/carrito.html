<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="ventana ventana-carrito">

  <header class="ventana-encabezado">
    <h2 id="titulo-carrito">Carrito</h2>
  </header>

 <div id="contenido-carrito" class="ventana-contenido">

    <h4>Productos seleccionados</h4>

    <div id="lista-productos">
        <p>Tu carrito está vacío.</p>
    </div>

</div>

  <footer class="ventana-pie">
  <div class="resumen-carrito">
    <h4>Resumen del pedido</h4>

    <div class="d-flex justify-content-between">
      <span>Subtotal:</span>
      <span id="subtotal-carrito">$0.00</span>
    </div>

    <div class="d-flex justify-content-between mt-2">
      <span>Total:</span>
      <span id="total-carrito">$0.00</span>
    </div>

     <a href="direccion.html" class="btn btn-danger w-100 mt-3"> 
        Continuar a direccion de envío
      </a>
  </div>
  <p class="small text-center text-secondary mt-3 mb-0">Desarrollado por: Jose David Hernandez Aranzales</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/carrito.js"></script>
</body>
</html>

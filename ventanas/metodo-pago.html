<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Método de pago</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/metodo-pago.css">
</head>
<body class="ventana ventana-metodo-pago">

  <header class="ventana-encabezado">
    <h2 id="titulo-metodo-pago">Método de pago</h2>
  </header>

 
<div id="contenido-metodo-pago" class="ventana-contenido">

    <h4>Selecciona tu método de pago</h4>
    <p>Elige cómo deseas pagar tu pedido.</p>

    <form id="form-metodo-pago">

        <div class="opcion-pago">
            <input class="form-check-input" type="radio" name="metodo-pago" id="pago-tarjeta" value="tarjeta" required>

            <label for="pago-tarjeta">
                <i class="bi bi-credit-card"></i>
                Tarjeta de crédito o débito
            </label>
        </div>

        <div class="opcion-pago">
            <input class="form-check-input" type="radio" name="metodo-pago" id="pago-transferencia" value="transferencia">

            <label for="pago-transferencia">
                <i class="bi bi-bank"></i>
                Transferencia bancaria
            </label>
        </div>

        <!-- datos que aparecen cuando el usuario elige tarjeta -->
        <fieldset id="datos-tarjeta" class="d-none mt-3" disabled>
        <legend class="h5">Datos de la tarjeta</legend>

        <label for="nombre-tarjeta" class="form-label">Nombre del titular</label>
        <input type="text" id="nombre-tarjeta" class="form-control mb-3"
            placeholder="prueba" required>

        <label for="ultimos-cuatro" class="form-label">Número de tarjeta</label>
        <input type="text" id="ultimos-cuatro" class="form-control mb-3"
            placeholder="4242424242424242" inputmode="numeric" maxlength="16"
            pattern="[0-9]{16}" title="Escribe 16 dígitos sin espacios" required>
        <label for="vencimiento-tarjeta" class="form-label">Mes y año de vencimiento</label>
        <input type="month" id="vencimiento-tarjeta" class="form-control" required>
        </fieldset>

    </form>

    <div class="resumen-pago">
        <h4>Resumen del pedido</h4>

        <div class="d-flex justify-content-between">
            <span>Subtotal:</span>
            <span id="subtotal-pago">$0.00</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between">
            <strong>Total:</strong>
            <strong id="total-pago">$0.00</strong>
        </div>
    </div>

</div>


  
<footer class="ventana-pie">

    <div class="d-flex justify-content-between flex-wrap gap-2 mt-4">

        <a href="direccion.html" class="btn btn-outline-secondary">
            Volver a dirección
        </a>

        <button type="submit" form="form-metodo-pago" class="btn btn-danger" id="btn-confirmar-pago">
        Confirmar pedido
        </button>

    </div>

    <p class="small text-center text-secondary mt-3 mb-0">Desarrollado por: Jose David Hernandez Aranzales</p>

</footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/metodo-pago.js"></script>
</body>
</html>

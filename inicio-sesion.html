<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | ApexDroid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/inicio-sesion.css">
</head>

<body class="pagina-inicio-sesion">
  <div class="card">
    <h2>Inicio de sesión</h2>

    <form action="index.html">
      <div class="formulario-grupo">
        <label for="email"> Correo electronico</label>
        <div class="caja">
          <input type="email" id="email" placeholder="Email" required>
        </div>
      </div>


      <!--contraseña-->
      <div class="formulario-grupo">
        <label for="password">Contraseña</label>
        <div class="caja">
          <input type="password" id="password" placeholder="*******" required>
        </div>
      </div>

      <p class="texto-registro">
        <span style="color: #ff3333;">¿No tienes cuenta?</span>
        <a href="registro.html">Regístrate</a>
      </p>

      <!--boton de google-->
      <button type="button" class="btn-google">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        Continuar con Google
      </button>

      <!--boton de enviar-->
      <button type="submit" class="btn-submit">Iniciar sesion</button>
    </form>

  </div>

  <footer class="mt-3 text-center">
    <p class="small mb-0">Desarrollado por: Joanna Berenice Duran Zuñiga</p>
  </footer>

  <script src="js/inicio-sesion.js"></script>
</body>

</html>
